[package]
name = "keez-sidecar"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "keez-sidecar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
argon2 = "0.5"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
base64 = { version = "0.22", features = ["alloc"] }
